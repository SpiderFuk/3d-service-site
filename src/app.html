<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/brand/favicon.svg" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Fuentes de marca: Bricolage Grotesque (titulos) + Figtree (texto) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
		/>
		<!-- Variables de marca (colores, radios, --extrude) -->
		<link rel="stylesheet" href="%sveltekit.assets%/brand/brand.css" />
		<meta name="theme-color" content="#2B3CFF" />

		<!-- SEO (en app.html porque la pagina usa ssr = false y los crawlers no ejecutan JS) -->
		<title>printo | Impresión 3D en Montevideo y Las Piedras</title>
		<meta
			name="description"
			content="Impresión 3D hecha en Uruguay. Mandanos tu archivo STL o 3MF, miralo en 3D y pedí presupuesto por WhatsApp. PLA, PETG, ABS y TPU en varios colores."
		/>
		<meta name="keywords" content="impresión 3D, Uruguay, Montevideo, Las Piedras, PLA, PETG, ABS, TPU, prototipado" />
		<meta name="author" content="printo" />
		<link rel="canonical" href="https://printo.uy/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="printo" />
		<meta property="og:locale" content="es_UY" />
		<meta property="og:url" content="https://printo.uy/" />
		<meta property="og:title" content="printo | Tu idea, en tus manos." />
		<meta
			property="og:description"
			content="Impresión 3D hecha en Uruguay. Mandanos tu archivo y la imprimimos. Así de simple."
		/>
		<meta property="og:image" content="https://printo.uy/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="printo, impresión 3D hecha en Uruguay" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="printo | Tu idea, en tus manos." />
		<meta
			name="twitter:description"
			content="Impresión 3D hecha en Uruguay. Mandanos tu archivo y la imprimimos. Así de simple."
		/>
		<meta name="twitter:image" content="https://printo.uy/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
